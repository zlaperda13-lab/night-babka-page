<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NIGHT BABKA</title>

<style>

/* =========================
   BASE
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;

    background: #010201;

    color: #b8c1b8;

    font-family: monospace;
}

body {
    display: flex;
    justify-content: center;

    padding: 20px 12px;
}


/* =========================
   PAGE
========================= */

.page {

    width: 100%;
    max-width: 900px;

    min-height: calc(100vh - 40px);

    position: relative;

    overflow: hidden;

    padding: 32px;

    border: 1px solid #1d221e;

    background:
        linear-gradient(
            rgba(70,90,70,.012) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(70,90,70,.012) 1px,
            transparent 1px
        ),
        #040504;

    background-size: 25px 25px;

    box-shadow:
        0 0 80px rgba(0,0,0,.95),
        inset 0 0 120px rgba(0,0,0,.85);
}


/* =========================
   SCANLINES
========================= */

.scanlines {

    position: absolute;

    inset: 0;

    z-index: 2;

    pointer-events: none;

    opacity: .035;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 4px,
            rgba(255,255,255,.5) 5px
        );
}


/* =========================
   FOG
========================= */

.fog {
    position: absolute;

    inset: -20%;

    z-index: 3;

    pointer-events: none;

    overflow: hidden;
}


/* первый слой */

.fog::before {

    content: "";

    position: absolute;

    width: 130%;
    height: 55%;

    left: -15%;
    top: 8%;

    background:
        radial-gradient(
            ellipse at center,
            rgba(145,155,145,.15) 0%,
            rgba(110,125,110,.10) 25%,
            rgba(70,80,70,.055) 45%,
            transparent 72%
        );

    opacity: .8;

    animation:
        fogOne
        18s
        ease-in-out
        infinite
        alternate;
}


/* второй слой */

.fog::after {

    content: "";

    position: absolute;

    width: 150%;
    height: 48%;

    left: -25%;
    top: 45%;

    background:
        radial-gradient(
            ellipse at center,
            rgba(125,140,125,.12) 0%,
            rgba(80,95,80,.065) 35%,
            transparent 72%
        );

    opacity: .65;

    animation:
        fogTwo
        24s
        ease-in-out
        infinite
        alternate;
}


@keyframes fogOne {

    0% {
        transform:
            translateX(-13%)
            translateY(5%)
            scale(1);
    }

    50% {
        transform:
            translateX(8%)
            translateY(-3%)
            scale(1.12);
    }

    100% {
        transform:
            translateX(-2%)
            translateY(7%)
            scale(1.2);
    }
}


@keyframes fogTwo {

    0% {
        transform:
            translateX(12%)
            translateY(-4%)
            scale(1.1);
    }

    50% {
        transform:
            translateX(-10%)
            translateY(5%)
            scale(1);
    }

    100% {
        transform:
            translateX(5%)
            translateY(-6%)
            scale(1.15);
    }
}


/* =========================
   CONTENT
========================= */

.header,
.network,
.footer {

    position: relative;

    z-index: 10;
}


/* =========================
   HEADER
========================= */

.header {

    text-align: center;

    margin-bottom: 38px;
}


.header h1 {

    margin: 0;

    font-size:
        clamp(
            30px,
            8vw,
            64px
        );

    letter-spacing: 8px;

    color: #d3dad3;

    text-shadow:
        0 0 14px
        rgba(150,180,150,.12);
}


/* =========================
   SLOGAN
========================= */

.slogan {

    position: relative;

    display: inline-block;

    max-width: 100%;

    margin-top: 18px;

    padding: 2px 4px;

    font-size:
        clamp(
            12px,
            3.1vw,
            18px
        );

    font-weight: bold;

    letter-spacing: 4px;

    line-height: 1.5;

    color: #9aa59a;

    animation:
        sloganFlicker
        5s
        infinite;
}


/* красный слой */

.slogan::before {

    content:
        "ИСТОРИИ, КОТОРЫЕ ЛУЧШЕ НЕ ЧИТАТЬ НОЧЬЮ";

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;

    color: #a52220;

    opacity: 0;

    pointer-events: none;

    animation:
        redGlitch
        3.7s
        infinite
        steps(1);
}


/* бирюзовый слой */

.slogan::after {

    content:
        "ИСТОРИИ, КОТОРЫЕ ЛУЧШЕ НЕ ЧИТАТЬ НОЧЬЮ";

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;

    color: #39706d;

    opacity: 0;

    pointer-events: none;

    animation:
        cyanGlitch
        4.9s
        infinite
        steps(1);
}


@keyframes sloganFlicker {

    0%,
    15%,
    18%,
    40%,
    42%,
    70%,
    72%,
    100% {
        opacity: 1;
    }

    16% {
        opacity: .2;
    }

    17% {
        opacity: .8;
    }

    41% {
        opacity: .35;
    }

    71% {
        opacity: .45;
    }
}


@keyframes redGlitch {

    0%,
    76%,
    100% {
        opacity: 0;
    }

    77% {
        opacity: .9;

        clip-path:
            inset(0 0 65% 0);

        transform:
            translateX(-7px);
    }

    78% {
        opacity: .8;

        clip-path:
            inset(45% 0 20% 0);

        transform:
            translateX(6px);
    }

    79% {
        opacity: 0;
    }

    91% {
        opacity: .8;

        clip-path:
            inset(20% 0 55% 0);

        transform:
            translateX(5px);
    }

    92% {
        opacity: 0;
    }
}


@keyframes cyanGlitch {

    0%,
    58%,
    100% {
        opacity: 0;
    }

    59% {
        opacity: .8;

        clip-path:
            inset(60% 0 10% 0);

        transform:
            translateX(7px);
    }

    60% {
        opacity: .75;

        clip-path:
            inset(10% 0 65% 0);

        transform:
            translateX(-6px);
    }

    61% {
        opacity: 0;
    }

    84% {
        opacity: .75;

        clip-path:
            inset(35% 0 35% 0);

        transform:
            translateX(-5px);
    }

    85% {
        opacity: 0;
    }
}


/* =========================
   STATUS
========================= */

.status {

    margin-top: 18px;

    font-size: 10px;

    letter-spacing: 2px;

    color: #4e584f;
}


.status span {

    color: #789278;
}


/* =========================
   QR NETWORK
========================= */

.network {

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 22px;

    max-width: 700px;

    margin: 0 auto;
}


/* =========================
   NODE
========================= */

.node {

    min-height: 235px;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    border: 1px solid #2b332d;

    background:
        linear-gradient(
            135deg,
            rgba(35,45,37,.16),
            rgba(2,4,3,.94)
        );

    transition:
        border-color .25s ease,
        transform .25s ease,
        box-shadow .25s ease;
}


.node:hover {

    border-color: #647064;

    transform:
        translateY(-4px);

    box-shadow:
        0 0 25px
        rgba(100,130,100,.08);
}


.node a {

    text-decoration: none;

    color: inherit;

    width: 100%;
    height: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;
}


/* =========================
   QR
========================= */

.qr {

    width: 155px;
    height: 155px;

    padding: 7px;

    background: #eeeeea;

    border: 1px solid #9aa29a;

    box-shadow:
        0 0 18px
        rgba(0,0,0,.7);
}


.qr img {

    display: block;

    width: 100%;
    height: 100%;

    object-fit: contain;
}


/* =========================
   LABELS
========================= */

.label {

    margin-top: 15px;

    font-size: 12px;

    letter-spacing: 3px;

    color: #899489;

    text-transform: uppercase;
}


.description {

    margin-top: 7px;

    font-size: 9px;

    letter-spacing: 1px;

    color: #4e584f;
}


/* =========================
   FOOTER
========================= */

.footer {

    margin-top: 45px;

    padding-top: 20px;

    border-top: 1px solid #1c211d;

    text-align: center;

    font-size: 10px;

    line-height: 1.9;

    letter-spacing: 1px;

    color: #485148;
}


.footer .warning {

    margin-top: 12px;

    color: #626d62;
}


.author {

    margin-top: 18px;

    font-size: 7px;

    letter-spacing: 2px;

    color: #303730;

    opacity: .65;
}


/* =========================
   PHONE
   ALWAYS 2 × 2
========================= */

@media (max-width: 700px) {

    body {
        padding: 8px;
    }

    .page {

        padding:
            20px 12px;

        min-height:
            calc(100vh - 16px);
    }

    .header {

        margin-bottom: 28px;
    }

    .header h1 {

        letter-spacing: 5px;
    }

    .slogan {

        font-size: 12px;

        letter-spacing: 1.5px;
    }

    .network {

        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 12px;
    }

    .node {

        min-height: 190px;

        padding: 10px;
    }

    .qr {

        width: 110px;
        height: 110px;

        padding: 6px;
    }

    .label {

        margin-top: 10px;

        font-size: 10px;

        letter-spacing: 2px;
    }

    .description {

        font-size: 7px;

        letter-spacing: .5px;
    }

    .status {

        font-size: 9px;
    }
}


/* =========================
   VERY SMALL PHONE
   STILL 2 × 2
========================= */

@media (max-width: 380px) {

    .network {

        gap: 8px;
    }

    .node {

        min-height: 175px;

        padding: 7px;
    }

    .qr {

        width: 92px;
        height: 92px;
    }

    .label {

        font-size: 9px;

        letter-spacing: 1px;
    }

    .description {

        font-size: 6px;
    }
}

</style>
</head>


<body>

</body>
</html>

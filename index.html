<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NIGHT BABKA</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
    background: #060807;
    color: #b8c1b8;
    font-family: monospace;
}

body {
    display: flex;
    justify-content: center;
    padding: 20px 12px;
}

.page {
    width: 100%;
    max-width: 900px;
    min-height: calc(100vh - 40px);
    position: relative;
    overflow: hidden;

    padding: 32px;

    border: 1px solid #252c27;

    background:
        linear-gradient(rgba(120,150,120,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(120,150,120,.025) 1px, transparent 1px),
        #090b0a;

    background-size: 25px 25px;

    box-shadow:
        0 0 50px rgba(0,0,0,.7),
        inset 0 0 80px rgba(0,0,0,.45);
}

/* лёгкий телевизионный шум */

.noise {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: .055;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 3px,
            #ffffff 4px
        );
}

/* заголовок */

.header {
    position: relative;
    text-align: center;
    margin-bottom: 38px;
}

.header h1 {
    margin: 0;

    font-size: clamp(30px, 8vw, 64px);
    letter-spacing: 8px;

    color: #d3dad3;

    text-shadow:
        0 0 12px rgba(150,180,150,.12);
}

.subtitle {
    margin-top: 12px;

    font-size: 11px;
    letter-spacing: 3px;

    color: #596359;
}

.status {
    margin-top: 18px;

    font-size: 10px;
    letter-spacing: 2px;

    color: #4e584f;
}

.status span {
    color: #789278;
}

/* сетка */

.network {
    position: relative;

    display: grid;
    grid-template-columns: repeat(2, 1fr);

    gap: 22px;

    max-width: 700px;
    margin: 0 auto;
}

/* карточка */

.node {
    position: relative;

    min-height: 235px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    padding: 20px;

    border: 1px solid #2d352f;

    background:
        linear-gradient(
            135deg,
            rgba(40,50,42,.20),
            rgba(5,8,6,.88)
        );

    transition:
        border-color .25s ease,
        transform .25s ease,
        box-shadow .25s ease;
}

/* небольшой разброс */

.node:nth-child(2) {
    transform: translateY(18px);
}

.node:nth-child(3) {
    transform: translateY(-10px);
}

.node:nth-child(4) {
    transform: translateY(25px);
}

.node:nth-child(5) {
    grid-column: 1 / 3;
    max-width: 340px;
    width: 100%;
    justify-self: center;

    transform: translateY(5px);
}

/* наведение */

.node:hover {
    border-color: #667466;

    transform:
        translateY(-4px);

    box-shadow:
        0 0 25px rgba(100,130,100,.08);
}

.node:nth-child(2):hover,
.node:nth-child(3):hover,
.node:nth-child(4):hover {
    transform: translateY(-4px);
}

.node:nth-child(5):hover {
    transform: translateY(-4px);
}

/* ссылка */

.node a {
    text-decoration: none;
    color: inherit;

    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* QR */

.qr {
    width: 155px;
    height: 155px;

    padding: 7px;

    background: #eeeeea;

    border: 1px solid #9aa29a;

    box-shadow:
        0 0 18px rgba(0,0,0,.6);
}

.qr img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: contain;
}

/* подпись */

.label {
    margin-top: 15px;

    font-size: 12px;
    letter-spacing: 3px;

    color: #899489;

    text-transform: uppercase;
}

.description {
    margin-top: 7px;

    font-size: 9px;
    letter-spacing: 1px;

    color: #4e584f;
}

/* нижняя часть */

.footer {
    position: relative;

    margin-top: 45px;

    padding-top: 20px;

    border-top: 1px solid #202720;

    text-align: center;

    font-size: 10px;
    line-height: 1.9;

    letter-spacing: 1px;

    color: #485148;
}

.footer .warning {
    margin-top: 12px;

    color: #626d62;
}

/* мобильные */

@media (max-width: 650px) {

    body {
        padding: 8px;
    }

    .page {
        padding: 20px 14px;
        min-height: calc(100vh - 16px);
    }

    .header {
        margin-bottom: 28px;
    }

    .header h1 {
        letter-spacing: 5px;
    }

    .network {
        grid-template-columns: 1fr;
        gap: 16px;
    }

    .node,
    .node:nth-child(2),
    .node:nth-child(3),
    .node:nth-child(4),
    .node:nth-child(5) {
        grid-column: 1;
        transform: none;
        max-width: none;
    }

    .node:hover,
    .node:nth-child(2):hover,
    .node:nth-child(3):hover,
    .node:nth-child(4):hover,
    .node:nth-child(5):hover {
        transform: translateY(-3px);
    }

    .node {
        min-height: 215px;
    }

    .qr {
        width: 145px;
        height: 145px;
    }
}
</style>
</head>

<body>

<div class="page">

    <div class="noise"></div>

    <header class="header">

        <div class="subtitle">

        <div class="node">

        <!-- YouTube -->

        <div class="node">

            >

        <!-- Планета -->

        <div class="node">

                </div>

        </div>


    </main>


    <footer class="footer">

        NODE COUNT: 05<br>

        CONNECTION: ACTIVE<br>

        LAST SIGNAL: UNKNOWN

        <div class="warning">
            NIGHT BABKA — ИСТОРИИ, КОТОРЫЕ ЛУЧШЕ НЕ ЧИТАТЬ НОЧЬЮ.
        </div>

    </footer>

</div>

</body>
</html>
